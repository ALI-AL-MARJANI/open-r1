name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    name: Lint and fast tests (CPU, no network)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        # The rewards, data conversion and metrics only need the standard library.
        run: python -m pip install pytest==9.1.1 ruff==0.16.10 pyyaml==6.0.3
      - name: Lint
        run: make grounded-quality
      - name: Tests
        run: make grounded-test
