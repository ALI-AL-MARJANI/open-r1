# Supervised baseline: LoRA fine-tuning of Qwen2.5-0.5B-Instruct on reference responses.
# Run: python scripts/grounded/train_sft.py --config configs/grounded/sft_qwen0.5b.yaml --seed 0
# Same training pool, LoRA shape and prompt as grpo_qwen0.5b.yaml.

run_name: sft_qwen0.5b

model:
  name: Qwen/Qwen2.5-0.5B-Instruct
  dtype: bfloat16

lora:
  r: 32
  alpha: 64
  dropout: 0.0
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

data:
  dataset: squad_v2
  split: train
  n_examples: 2000
  answerable_fraction: 0.5
  n_distractors: 3
  max_prompt_words: 700
  seed: 0

sft:                        # passed to trl.SFTConfig (TRL 0.29.1)
  num_train_epochs: 2
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 2
  learning_rate: 1.0e-4
  lr_scheduler_type: cosine
  warmup_steps: 10
  bf16: true
  logging_steps: 5
  save_steps: 25            # checkpoints allow --resume after an interruption
  save_total_limit: 1
  report_to: none
